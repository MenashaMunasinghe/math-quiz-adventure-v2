<!DOCTYPE html>
<html lang="en">
<head>

    </div>

    <table class="leaderboard-table">
      <thead>
        <tr>
          <th>Rank</th>
          <th>Player</th>
          <th>Level</th>
          <th>Time</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>Sam</td>
          <td>10</td>
          <td>30s</td>
        </tr>
        <tr>
          <td>2</td>
          <td>Mike</td>

        <tr>
          <td>3</td>
          <td>Smith</td>
          <td>9</td>
          <td>53s</td>
        </tr>
        <tr>
          <td>4</td>
          <td>Kate</td>
          <td>10</td>
          <td>1min</td>
        </tr>
        <tr>
          <td>5</td>
          <td>Bille</td>
          <td>9</td>
          <td>1min 34s</td>
        </tr>
        <tr>
          <td>6</td>
          <td>Dami</td>
          <td>8</td>
          <td>1min 52s</td>
        </tr>
        <tr>
          <td>7</td>
          <td>Menasha</td>
          <td>10</td>
          <td>2min</td>
        </tr>
      </tbody>
    </table>

    <div class="buttons">
      <button class="btn" onclick="window.location.href='index.html'">Restart</button>
      <button class="btn exit" onclick="window.close()">Exit</button>
    </div>
  </div>
  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/leaderboard.js"></script>
</body>
</html>
